;
;Amlogic sdcard burning configure script
; 魔改版 — 兼容国产 eMMC (Foresee/Biwin/YTXC, mafId=0xD6)
;
; 修改点:
;   erase_bootloader = 0  (原值=1, 导致国产 eMMC 擦除超时)
;   erase_flash      = 1  (普通擦除, 不用4=强制擦除)
;
[common]
erase_bootloader    = 0
erase_flash         = 1
reboot              = 0

[burn_ex]
package     = aml_upgrade_package.img
